name: Build

on:
  push:
    branches: [main, debug]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing (e.g. a dependency without wheels for it) shouldn't cancel the others
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: gru-linux
            artifact-path: dist/gru
          - os: ubuntu-24.04-arm
            artifact-name: gru-linux-arm64
            artifact-path: dist/gru
          - os: windows-latest
            artifact-name: gru-windows
            artifact-path: dist/gru.exe
            msix-arch: x64
          - os: windows-11-arm
            artifact-name: gru-windows-arm64
            artifact-path: dist/gru.exe
            msix-arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      # Full history and tags, for gru.spec's `git describe` of non-release builds
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Check the tag matches pyproject.toml's version
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml's version $version"
            exit 1
          fi

      - name: Install GTK/WebKit (pywebview's Linux backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config gcc python3-dev

      - name: Install gru and gru-nicegui
        shell: bash
        env:
          GRU_REPO_TOKEN: ${{ secrets.GRU_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${GRU_REPO_TOKEN}@github.com/Glande-Pas/".insteadOf \
            "https://github.com/Glande-Pas/"
          git clone -b "${{ github.ref_name }}" https://github.com/Glande-Pas/gru.git "$RUNNER_TEMP/gru"
          pip install --upgrade pip
          pip install "$RUNNER_TEMP/gru"
          pip install -e ".[build]"

      - name: Describe versions from git
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          gru=$(git -C "$RUNNER_TEMP/gru" describe --tags --long --always --dirty)
          ui=$(git describe --tags --long --always --dirty)
          printf 'VERSIONS = {"gru-nicegui": "%s", "gru": "%s"}\n' "$ui" "$gru" > gru_ui/_build_version.py

      - name: Build with PyInstaller
        env:
          GRU_CONSOLE: ${{ github.ref_type == 'tag' && '0' || '1' }}
        run: pyinstaller gru.spec

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}

      - name: Package MSIX
        if: runner.os == 'Windows'
        run: python packaging/msix/build_msix.py dist/gru.exe ${{ matrix.msix-arch }} dist/gru-${{ matrix.msix-arch }}.msix

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact-name }}-msix
          path: dist/gru-${{ matrix.msix-arch }}.msix

      - name: Collect release files with non-clashing names
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          mkdir -p dist/release
          path='${{ matrix.artifact-path }}'
          [[ "$path" == *.exe ]] && ext='.exe' || ext=''
          cp "$path" "dist/release/${{ matrix.artifact-name }}$ext"

      - name: Upload to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: ${{ matrix.artifact-path }}

  # Submit both architectures' MSIX to the Microsoft Store as one bundle using repo secrets
  store-submit:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    permissions:
      contents: read  # checkout
      actions: read   # download this run's MSIX artifacts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Bundle the MSIX packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern '*-msix' --dir msix
          python packaging/msix/build_msix.py bundle store/gru.msixbundle msix/*/*.msix

      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Submit to the Microsoft Store
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          msstore publish store --inputFile store/gru.msixbundle --appId 9P1251PBNJMM
