name: Build

on:
  push:
    branches: [main]
    tags: ['*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing (e.g. a dependency without wheels for it) shouldn't cancel the others
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: gru-linux
          - os: ubuntu-24.04-arm
            artifact-name: gru-linux-arm64
          - os: windows-latest
            artifact-name: gru-windows
            msix-arch: x64
          - os: windows-11-arm
            artifact-name: gru-windows-arm64
            msix-arch: arm64
    runs-on: ${{ matrix.os }}
    outputs:
      msix-version: ${{ steps.msix.outputs.version }}
    steps:
      # Full history and tags, for gru.spec's `git describe` of non-release builds
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Check the tag matches pyproject.toml's version
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml's version $version"
            exit 1
          fi

      - name: Install GTK/WebKit (pywebview's Linux backend)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-gtk-3.0 gir1.2-webkit2-4.1 \
            libgirepository1.0-dev libcairo2-dev pkg-config gcc python3-dev

      - name: Install gru and gru-nicegui
        shell: bash
        run: |
          git clone -b "${{ github.ref_name }}" https://gitlab.com/glandepas/gru.git "$RUNNER_TEMP/gru"
          pip install --upgrade pip
          pip install "$RUNNER_TEMP/gru"
          pip install -e ".[build]"

      - name: Describe versions from git
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          gru=$(git -C "$RUNNER_TEMP/gru" describe --tags --long --always --dirty)
          ui=$(git describe --tags --long --always --dirty)
          printf 'VERSIONS = {"gru-nicegui": "%s", "gru": "%s"}\n' "$ui" "$gru" > gru_ui/_build_version.py

      - name: Build with PyInstaller
        env:
          GRU_CONSOLE: ${{ github.ref_type == 'tag' && '0' || '1' }}
        run: pyinstaller gru.spec

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/gru${{ runner.os == 'Windows' && '.exe' || '' }}

      - name: Package MSIX
        if: runner.os == 'Windows'
        id: msix
        env:
          MSIX_ARCH: ${{ matrix.msix-arch }}
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $makeappx) { throw 'makeappx.exe not found: the Windows SDK is required' }
          $version = python -c "import tomllib; print('.'.join((tomllib.load(open('pyproject.toml', 'rb'))['project']['version'].split('.') + ['0'] * 4)[:4]))"
          "version=$version" | Tee-Object -Filepath $env:GITHUB_OUTPUT -Append
          $staging = New-Item -ItemType Directory "$env:RUNNER_TEMP\msix"
          Copy-Item dist\gru.exe, packaging\msix\Assets $staging -Recurse
          (Get-Content packaging\msix\AppxManifest.xml -Raw).Replace('{VERSION}', $version).Replace('{ARCH}', $env:MSIX_ARCH) |
            Set-Content "$staging\AppxManifest.xml" -Encoding utf8NoBOM -NoNewline
          & $makeappx.FullName pack /d $staging /p "dist\gru-$env:MSIX_ARCH.msix" /o

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: ${{ matrix.artifact-name }}-msix
          path: dist/gru-${{ matrix.msix-arch }}.msix

  flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Freeze Python dependencies
        run: |
          pip3 install --user flatpak-pip-generator==2026.5.28 yq
          runtime=$(~/.local/bin/yq -r '.sdk + "//" + .["runtime-version"]' packaging/flatpak/io.github.Glande_Pas.Gru.yml)
          ~/.local/bin/flatpak_pip_generator --pyproject-file pyproject.toml \
            --runtime "$runtime" --output packaging/flatpak/python-deps \
            --ignore-installed gru-eso,nicegui,requests,pywebview \
            --prefer-wheels aiohttp,httptools,markupsafe,orjson,pydantic-core,pyyaml,unicodedata2,uvloop,watchfiles || :
          [ -f packaging/flatpak/python-deps.json ]

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/io.github.Glande_Pas.Gru.yml
          arch: ${{ matrix.arch }}
          build-dir: build/flatpak
          repo-dir: build/repo
          bundle: gru-${{ matrix.arch }}.flatpak
          artifact-name: gru-linux-${{ matrix.arch }}-flatpak

      - name: Upload to GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: gru-${{ matrix.arch }}.flatpak


  # Submit both architectures' MSIX to the Microsoft Store as one bundle using repo secrets
  store-submit:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: windows-latest
    permissions:
      actions: read  # download this run's MSIX artifacts
    steps:
      - name: Bundle the MSIX packages
        env:
          GH_TOKEN: ${{ github.token }}
          MSIX_VERSION: ${{ needs.build.outputs.msix-version }}
        run: |
          gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --pattern '*-msix' --dir "$env:RUNNER_TEMP\artifacts"
          $packages = New-Item -ItemType Directory "$env:RUNNER_TEMP\msix"
          Get-ChildItem "$env:RUNNER_TEMP\artifacts" -Recurse -Filter *.msix | Move-Item -Destination $packages
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $makeappx) { throw 'makeappx.exe not found: the Windows SDK is required' }
          New-Item -ItemType Directory store | Out-Null
          & $makeappx.FullName bundle /d $packages /p store\gru.msixbundle /bv $env:MSIX_VERSION /o

      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Submit to the Microsoft Store
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          SELLER_ID: ${{ secrets.PARTNER_CENTER_SELLER_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: |
          msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID `
            --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
          msstore publish store --inputFile store/gru.msixbundle --appId 9P1251PBNJMM
